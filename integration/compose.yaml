name: wlw-contract-example

x-common: &common
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ../../reference:/reference:ro
    - ../../run:/run

services:
  report-decompose:
    <<: *common
    image: wlw/person-a:example
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    command:
      - --input
      - /run/input/pipeline/cases.json
      - --output
      - /run/output/pipeline/cases/example-case/D_dx_pairs.json
      - --config
      - /app/components/person_a/configs/example.json

  interest-pattern:
    <<: *common
    image: wlw/person-c:example
    build:
      context: ..
      dockerfile: components/person_c/Dockerfile
    command:
      - --input
      - /run/input/pipeline/cases.json
      - --output
      - /run/output/pipeline/cases/example-case/E_rois.json
      - --config
      - /app/components/person_c/configs/example.json

  knowledge-retrieval:
    <<: *common
    image: wlw/person-b:example
    build:
      context: ..
      dockerfile: components/person_b/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
    command:
      - --input
      - /run/input/pipeline/A_literature.json
      - --input
      - /run/output/pipeline/cases/example-case/D_dx_pairs.json
      - --output
      - /run/output/pipeline/cases/example-case/F_chunks.json
      - --config
      - /app/components/person_b/configs/example.json

  query-generation:
    <<: *common
    image: wlw/person-a:example
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    entrypoint: ["python", "-m", "components.person_a.query_generation"]
    depends_on:
      knowledge-retrieval:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/example-case/D_dx_pairs.json
      - --input
      - /run/output/pipeline/cases/example-case/F_chunks.json
      - --output
      - /run/output/pipeline/cases/example-case/G_queries.json
      - --config
      - /app/components/person_a/configs/example.json

  visual-filter:
    <<: *common
    image: wlw/person-d:example
    build:
      context: ..
      dockerfile: components/person_d/Dockerfile
    depends_on:
      interest-pattern:
        condition: service_completed_successfully
      query-generation:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/example-case/E_rois.json
      - --input
      - /run/output/pipeline/cases/example-case/G_queries.json
      - --output
      - /run/output/pipeline/cases/example-case/H_matches.json
      - --config
      - /app/components/person_d/configs/example.json

  clee:
    <<: *common
    image: wlw/person-e:demo
    build:
      context: ..
      dockerfile: components/person_e/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
      visual-filter:
        condition: service_completed_successfully
    command:
      - --input
      - /run/output/pipeline/cases/example-case/D_dx_pairs.json
      - --input
      - /run/output/pipeline/cases/example-case/H_matches.json
      - --output
      - /run/output/pipeline/cases/example-case/I_selected_rois.json
      - --config
      - /app/components/person_e/configs/default.json
