name: wlw-integration-demo

x-common: &common
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ./fixtures/input:/inputs:ro
    - ./configs:/configs:ro
    - ./artifacts:/artifacts
    - ../../../lab_19/DxStructuredCandidates_integrated.json:/references/DxStructuredCandidates_integrated.json:ro
    - ../../../lab_19/reference/candidateReference.json:/references/candidateReference.json:ro
    - ../../Histologic_Type_mappingTable.json:/references/Histologic_Type_mappingTable.json:ro
    - ../../[typeLevel]visualAttrs_v1.2.1_2603241656.json:/references/[typeLevel]visualAttrs_v1.2.1_2603241656.json:ro
    - ../../cleanSections_metaList_2603201640.json:/literature-source/cleanSections_metaList_2603201640.json:ro

services:
  literature-prepare:
    <<: *common
    image: wlw/person-b:demo
    build:
      context: ..
      dockerfile: components/person_b/Dockerfile
    entrypoint: ["python", "-m", "components.person_b.prepare_literature"]
    command:
      - --source
      - /literature-source/cleanSections_metaList_2603201640.json
      - --output
      - /artifacts/A_literature.json
      - --config
      - /configs/prepare_literature.json

  report-decompose:
    <<: *common
    image: wlw/person-a:demo
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    command:
      - --input
      - /inputs/B_report_tables.json
      - --output
      - /artifacts/D_dx_pairs_index.json
      - --config
      - /configs/report_decompose.json

  interest-pattern:
    <<: *common
    image: wlw/person-c:demo
    build:
      context: ..
      dockerfile: components/person_c/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
    command:
      - --input
      - /artifacts/cases/case-001/D_dx_pairs.json
      - --output
      - /artifacts/cases/case-001/E_rois.json
      - --config
      - /configs/interest_pattern.json

  knowledge-retrieval:
    <<: *common
    image: wlw/person-b:demo
    build:
      context: ..
      dockerfile: components/person_b/Dockerfile
    depends_on:
      literature-prepare:
        condition: service_completed_successfully
      report-decompose:
        condition: service_completed_successfully
    command:
      - --input
      - /artifacts/A_literature.json
      - --input
      - /artifacts/cases/case-001/D_dx_pairs.json
      - --output
      - /artifacts/cases/case-001/F_chunks.json
      - --config
      - /configs/knowledge_retrieval.json

  query-generation:
    <<: *common
    image: wlw/person-a:demo
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile
    entrypoint: ["python", "-m", "components.person_a.query_generation"]
    depends_on:
      knowledge-retrieval:
        condition: service_completed_successfully
    command:
      - --input
      - /artifacts/cases/case-001/D_dx_pairs.json
      - --input
      - /artifacts/cases/case-001/F_chunks.json
      - --output
      - /artifacts/cases/case-001/G_queries.json
      - --config
      - /configs/query_generation.json

  visual-filter:
    <<: *common
    image: wlw/person-d:demo
    build:
      context: ..
      dockerfile: components/person_d/Dockerfile
    depends_on:
      interest-pattern:
        condition: service_completed_successfully
      query-generation:
        condition: service_completed_successfully
    command:
      - --input
      - /artifacts/cases/case-001/E_rois.json
      - --input
      - /artifacts/cases/case-001/G_queries.json
      - --output
      - /artifacts/cases/case-001/H_matches.json
      - --config
      - /configs/visual_filter.json

  clee:
    <<: *common
    image: wlw/person-e:demo
    build:
      context: ..
      dockerfile: components/person_e/Dockerfile
    depends_on:
      report-decompose:
        condition: service_completed_successfully
      visual-filter:
        condition: service_completed_successfully
    command:
      - --input
      - /artifacts/cases/case-001/D_dx_pairs.json
      - --input
      - /artifacts/cases/case-001/H_matches.json
      - --output
      - /artifacts/cases/case-001/I_selected_rois.json
      - --config
      - /configs/clee.json
