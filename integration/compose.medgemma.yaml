services:
  medgemma-base:
    profiles: [medgemma-build]
    image: wlw/person-a:medgemma-base
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile.medgemma-base
    entrypoint: ["python", "--version"]

  report-decompose:
    image: wlw/person-a:medgemma
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile.medgemma
      args:
        MEDGEMMA_BASE_IMAGE: wlw/person-a:medgemma-base
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /models/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    # Report Decompose needs only these mounts.  Replacing x-common prevents
    # unrelated literature/visual references from blocking a B -> D run.
    volumes: !override
      - ./fixtures/input:/inputs:ro
      - ./configs:/configs:ro
      - ./artifacts:/artifacts
      - "${REPORT_ROOT:-./fixtures/input}:/data/reports:ro"
      - "${WSI_ROOT:-./fixtures/input}:/data/wsi:ro"
      - "${DX_CANDIDATES_PATH:-../../../lab_19/DxStructuredCandidates_integrated.json}:/references/DxStructuredCandidates_integrated.json:ro"
      - "${HF_CACHE_ROOT:-./model-cache/huggingface}:/models/huggingface"
    command:
      - --input
      - "${REPORT_TABLES_INPUT:-/inputs/B_report_tables.json}"
      - --output
      - /artifacts/D_dx_pairs_index.json
      - --config
      - /configs/report_decompose.medgemma.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  medgemma-runtime-check:
    profiles: [medgemma-tools]
    image: wlw/person-a:medgemma
    build:
      context: ..
      dockerfile: components/person_a/Dockerfile.medgemma
    entrypoint: ["python", "-m", "components.person_a.medgemma_smoke"]
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /models/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./configs:/configs:ro
      - "${HF_CACHE_ROOT:-./model-cache/huggingface}:/models/huggingface"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
